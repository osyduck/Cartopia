name: release

# Build the web + worker Docker images and push them to GHCR.
# Triggers on version tags (v1.2.3) and manual dispatch.
#
# Result:
#   ghcr.io/osyduck/cartopia-web:<version>    + :latest
#   ghcr.io/osyduck/cartopia-worker:<version> + :latest
#
# Multi-arch (amd64 + arm64) so the images run on x86 VPS and ARM VPS
# (e.g. Hetzner ARM). Build cache is stored in GitHub Actions cache.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Multi-arch build: QEMU emulates arm64 on the amd64 runner.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image names
        id: img
        run: |
          OWNER="$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          echo "web=$REGISTRY/$OWNER/cartopia-web" >> "$GITHUB_OUTPUT"
          echo "worker=$REGISTRY/$OWNER/cartopia-worker" >> "$GITHUB_OUTPUT"

      - name: Version tag
        id: ver
        run: |
          # v1.2.3 -> 1.2.3 ; workflow_dispatch falls back to the short SHA.
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build + push web
        uses: docker/build-push-action@v6
        with:
          context: .
          target: web
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.img.outputs.web }}:${{ steps.ver.outputs.version }}
            ${{ steps.img.outputs.web }}:latest
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - name: Build + push worker
        uses: docker/build-push-action@v6
        with:
          context: .
          target: worker
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.img.outputs.worker }}:${{ steps.ver.outputs.version }}
            ${{ steps.img.outputs.worker }}:latest
          cache-from: type=gha,scope=worker
          cache-to: type=gha,mode=max,scope=worker
