[databases]
; Route every database name through to the data plane Postgres.
* = host=dataplane-pg port=5432

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432

; Clients authenticate with SCRAM; PgBouncer resolves credentials per-role
; via auth_query against pg_shadow, so new roles work without restarts.
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt
auth_user = pgbouncer_auth
auth_dbname = postgres
auth_query = SELECT uname, phash FROM pgbouncer.user_lookup($1)

pool_mode = transaction
max_client_conn = 1000
default_pool_size = 20
min_pool_size = 0
reserve_pool_size = 5
server_idle_timeout = 120

ignore_startup_parameters = extra_float_digits
admin_users = postgres
