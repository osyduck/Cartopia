[databases]
; Route every database name through to the data plane Postgres.
* = host=dataplane-pg port=5432

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6433

; Same auth_query-based SCRAM setup as the transaction pooler.
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt
auth_user = pgbouncer_auth
auth_dbname = postgres
auth_query = SELECT uname, phash FROM pgbouncer.user_lookup($1)

; Session mode: a client holds its server connection for the whole session,
; so session-scoped features (SET, advisory locks, prepared statements) work.
pool_mode = session
max_client_conn = 1000
default_pool_size = 20
min_pool_size = 0
reserve_pool_size = 5
server_idle_timeout = 120

ignore_startup_parameters = extra_float_digits
admin_users = postgres
